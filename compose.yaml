services:
  storefront:
    image: docker.io/tanjimuladnan/storefront:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  catalog:
    image: eks-app/catalog:local
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: retail
      MYSQL_PASSWORD: retail-demo
      MYSQL_DATABASE: retail
    ports:
      - "8081:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  cart:
    image: docker.io/tanjimuladnan/cart:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    ports:
      - "8082:8000"
    depends_on:
      dynamodb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  checkout:
    image: docker.io/tanjimuladnan/checkout:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
    ports:
      - "8083:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  orders:
    image: docker.io/tanjimuladnan/orders:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail-demo
      POSTGRES_DATABASE: retail
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: retail
      RABBITMQ_PASSWORD: retail-demo
    ports:
      - "8084:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  api-service:
    image: docker.io/tanjimuladnan/api_service:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail-demo
      POSTGRES_DATABASE: retail
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: retail
      RABBITMQ_PASSWORD: retail-demo
    ports:
      - "8085:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: local-root
      MARIADB_DATABASE: retail
      MARIADB_USER: retail
      MARIADB_PASSWORD: retail-demo
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  dynamodb:
    image: amazon/dynamodb-local:latest
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail-demo
      POSTGRES_DB: retail
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: retail
      RABBITMQ_DEFAULT_PASS: retail-demo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
  postgres-data:
