{{- if .Values.app.messaging.rabbitmq.secret.create }}
{{- $password := include "orders.rabbitmq.password" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.messaging.rabbitmq.secret.name }}
data:
  RABBITMQ_DEFAULT_USER: {{ .Values.app.messaging.rabbitmq.secret.username | b64enc | quote }}
  RABBITMQ_DEFAULT_PASS: "{{ $password }}"
  RETAIL_ORDERS_MESSAGING_RABBITMQ_USERNAME: {{ .Values.app.messaging.rabbitmq.secret.username | b64enc | quote }}
  RETAIL_ORDERS_MESSAGING_RABBITMQ_PASSWORD: "{{ $password }}"
{{- end }}