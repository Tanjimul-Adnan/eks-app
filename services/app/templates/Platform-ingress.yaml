{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  namespace: retail-shop
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: {{ .Values.ui.host | default "://example.com" }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: retail-shop-ui # Points to your matrix-built storefront UI service
            port:
              number: 80
  - host: {{ .Values.argocd.host | default "://example.com" }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
{{- end }}
