cart:
  fullnameOverride: carts

catalog:
  fullnameOverride: catalog
  app:
    persistence:
      provider: mysql
  mysql:
    create: true
    persistentVolume:
      enabled: true

checkout:
  fullnameOverride: checkout
  app:
    persistence:
      provider: redis
    endpoints:
      orders: http://orders:80
  redis:
    create: true

orders:
  fullnameOverride: orders
  app:
    persistence:
      provider: postgres
      secret:
        create: true
        name: orders-db-credentials
    messaging:
      provider: rabbitmq
      rabbitmq:
        secret:
          create: true
          name: orders-rabbitmq-credentials
  postgresql:
    create: true
    persistentVolume:
      enabled: true
  rabbitmq:
    create: true
    persistentVolume:
      enabled: true

ui:
  fullnameOverride: ui
  app:
    endpoints:
      catalog: http://catalog:80
      carts: http://carts:80
      checkout: http://checkout:80
      orders: http://orders:80