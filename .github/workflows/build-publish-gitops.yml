name: build-publish-gitops
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for service in storefront catalog cart checkout; do
            docker build --pull -f "services/${service}/Dockerfile" -t "${REGISTRY}/retail-shop-dev/${service}:${SHA}" .
            docker push "${REGISTRY}/retail-shop-dev/${service}:${SHA}"
          done
      - name: Checkout Helm GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HELM_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: helm-repo
      - name: Update image tags and create PR
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HELM_REPO: ${{ vars.HELM_REPO }}
          HELM_VALUES_FILE: ${{ vars.HELM_VALUES_FILE }}
        run: |
          set -euo pipefail
          cd helm-repo
          python - <<'PY'
          import os, re
          path = os.environ["HELM_VALUES_FILE"]
          with open(path, encoding="utf-8") as f: content = f.read()
          for service in ("storefront", "catalog", "cart", "checkout"):
              pattern = rf'(?ms)(^  {service}:\n.*?^    image:\n.*?^      tag:\s*)["\']?[^\s]+'
              content, count = re.subn(pattern, lambda m: m.group(1) + '"' + os.environ["SHA"] + '"', content, count=1)
              if count != 1: raise SystemExit("Could not update image tag for " + service)
          with open(path, "w", encoding="utf-8") as f: f.write(content)
          PY
          BRANCH="bot/retail-${GITHUB_SHA::12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$HELM_VALUES_FILE"
          git commit -m "chore: update retail shop images to ${SHA}"
          git push origin "$BRANCH"
          gh pr create --repo "$HELM_REPO" --base main --head "$BRANCH" --title "chore: deploy retail shop ${SHA}" --body "Automated image update from retail-shop-app commit ${SHA}. Review and merge to deploy via Argo CD."
