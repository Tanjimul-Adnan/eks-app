name: build-publish-gitops

on:
  push:
    branches: [main]
  workflow_dispatch:

# Combined and declared correctly at the top level
permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fixed: Added the missing "with:" block and changed AWS_REGION to "aws-region"
      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Authenticate to GHCR using the automated token
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push your images dynamically
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-app:latest
            ghcr.io/${{ github.repository_owner }}/my-app:${{ github.sha }}
        
      - name: Checkout Helm GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HELM_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: helm-repo

      - name: Update image tags and create PR
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HELM_REPO: ${{ vars.HELM_REPO }}
          HELM_VALUES_FILE: ${{ vars.HELM_VALUES_FILE }}
        run: |
          set -euo pipefail
          cd helm-repo
          python - <<'PY'
          import os, re
          path = os.environ["HELM_VALUES_FILE"]
          with open(path, encoding="utf-8") as f: content = f.read()
          for service in ("storefront", "catalog", "cart", "checkout"):
              pattern = rf'(?ms)(^  {service}:\n.*?^    image:\n.*?^      tag:\s*)["\']?[^\s]+'
              content, count = re.subn(pattern, lambda m: m.group(1) + '"' + os.environ["SHA"] + '"', content, count=1)
              if count != 1: raise SystemExit("Could not update image tag for " + service)
          with open(path, "w", encoding="utf-8") as f: f.write(content)
          PY
          BRANCH="bot/retail-${GITHUB_SHA::12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$HELM_VALUES_FILE"
          git commit -m "chore: update retail shop images to ${SHA}"
          git push origin "$BRANCH"
          gh pr create --repo "$HELM_REPO" --base main --head "$BRANCH" --title "chore: deploy retail shop ${SHA}" --body "Automated image update from retail-shop-app commit ${SHA}. Review and merge to deploy via Argo CD."
