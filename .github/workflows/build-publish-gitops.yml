name: build-publish-gitops

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write 

jobs:
  build-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [storefront, catalog, cart, checkout]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tanjimuladnan
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            docker.io/tanjimuladnan/${{ matrix.service }}:latest
            docker.io/tanjimuladnan/${{ matrix.service }}:${{ github.sha }}

  update-gitops:
    needs: build-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Helm GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HELM_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: helm-repo

      - name: Update image tags and create PR
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HELM_REPO: ${{ vars.HELM_REPO }}
          # Handles both HELM_VALUES_FILES (comma-separated string) or single HELM_VALUES_FILE variables safely
          RAW_VALUES_FILES: ${{ vars.HELM_VALUES_FILES || vars.HELM_VALUES_FILE || 'apps/retail-shop/values-dev.yaml' }}
        run: |
          set -euo pipefail
          
          # 1. Clean up and resolve the file path out of the comma-separated string
          # Grabs the first item in the list and removes any accidental whitespace
          HELM_VALUES_FILE=$(echo "$RAW_VALUES_FILES" | tr ',' '\n' | head -n 1 | xargs)
          export HELM_VALUES_FILE
          
          # 2. Check if the file exists inside the checked-out helm subfolder
          if [[ ! -f "helm-repo/$HELM_VALUES_FILE" ]]; then
            echo "::error::HELM_VALUES_FILE '$HELM_VALUES_FILE' does not exist inside the helm-repo directory."
            exit 1
          fi

          cd helm-repo
          
          BRANCH="bot/retail-${GITHUB_SHA::12}"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > /dev/null; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi

          python - <<'PY'
          import os
          import re
          
          path = os.environ["HELM_VALUES_FILE"]
          sha = os.environ["SHA"]
          
          with open(path, encoding="utf-8") as f:
              content = f.read()
              
          for service in ("storefront", "catalog", "cart", "checkout"):
              headers = list(
                  re.finditer(rf"(?m)^  {re.escape(service)}:\s*$", content)
              )
              if len(headers) != 1:
                  raise SystemExit(
                      f"Could not find exactly one values section for {service}"
                  )
              start = headers[0].start()
              end = len(content)
              next_header = re.search(
                  r"(?m)^  [A-Za-z0-9_-]+:\s*$", content[headers[0].end() :]
              )
              if next_header:
                  end = headers[0].end() + next_header.start()
              section = content[start:end]
              image = re.search(r"(?ms)^    image:\s*\n(?P<body>.*)", section)
              if not image:
                  raise SystemExit(f"Could not find image configuration for {service}")
              image_body, repository_count = re.subn(
                  r"(?m)^      repository:\s*.*$",
                  f"      repository: tanjimuladnan/{service}",
                  image.group("body"),
                  count=1,
              )
              image_body, tag_count = re.subn(
                  r"(?m)^      tag:\s*.*$",
                  f'      tag: "{sha}"',
                  image_body,
                  count=1,
              )
              if repository_count != 1 or tag_count != 1:
                  raise SystemExit(
                      f"Could not update repository and image tag for {service}"
                  )
              section = (
                  section[: image.start("body")]
                  + image_body
              )
              content = content[:start] + section + content[end:]
              
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add "$HELM_VALUES_FILE"
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update retail shop images to ${SHA}"
            git push origin "$BRANCH"
          fi
          
          PR_URL="$(gh pr list --repo "$HELM_REPO" --head "${HELM_REPO%%/*}:$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$PR_URL" ]]; then
            # Check if remote changes actually exist before trying to build a PR
            if ! git diff --quiet origin/main..HEAD; then
              gh pr create --repo "$HELM_REPO" --base main --head "$BRANCH" --title "chore: deploy retail shop ${SHA}" --body "Automated Docker Hub image update from retail-shop-app commit ${SHA}. Review and merge to deploy via Argo CD."
            else
              echo "Image values are already up to date; no pull request is needed."
              exit 0
            fi
          fi
