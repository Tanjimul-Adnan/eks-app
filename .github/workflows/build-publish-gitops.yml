name: Build, Publish, and Update GitOps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones disabled for accurate blame info

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=your-sonar-org-key
            -Dsonar.projectKey=your-sonar-project-key
            -Dsonar.sources=services/
            -Dsonar.exclusions=**/chart/**,**/templates/**

  build-and-push:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: storefront
            context: services/ui
          - image: catalog
            context: services/catalog
          - image: cart
            context: services/cart
          - image: checkout
            context: services/checkout
          - image: orders
            context: services/orders
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'tanjimuladnan' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME || 'tanjimuladnan' }}/${{ matrix.image }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME || 'tanjimuladnan' }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  update-gitops:
    name: Update Helm chart and open deployment PR
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      pull-requests: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'tanjimuladnan' }}
      HELM_REPO: ${{ vars.HELM_REPO || 'Tanjimul-Adnan/eks-helm' }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Check out Helm GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HELM_REPO || 'Tanjimul-Adnan/eks-helm' }}
          token: ${{ secrets.GH_PAT }}
          ref: main
          path: helm-repo

      - name: Check out automation branch
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/retail-shop-${GITHUB_SHA:0:12}"
          if git -C helm-repo ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git -C helm-repo fetch origin "${branch}"
            git -C helm-repo checkout -B "${branch}" FETCH_HEAD
          else
            git -C helm-repo checkout -b "${branch}"
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Package application chart and update GitOps values
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${GH_TOKEN}" ]]; then
            echo "::error::Set the DOCKERHUB_USERNAME variable and GH_PAT secret."
            exit 1
          fi

          chart_dir="helm-repo/apps/retail-shop"
          if [[ ! -d "helm-repo/apps/retail-shop" ]]; then
            echo "::error::The Argo CD chart path apps/retail-shop does not exist in ${HELM_REPO}."
            exit 1
          fi

          helm dependency build services/app/chart

          rm -rf "${chart_dir}/templates" "${chart_dir}/charts" "${chart_dir}/charts-src"
          cp -a services/app/chart/. "${chart_dir}/"
          rm -rf "${chart_dir}/charts"

          mkdir -p "${chart_dir}/charts-src"
          for service in cart catalog checkout orders ui; do
            cp -a "services/${service}/chart" "${chart_dir}/charts-src/${service}"
          done

          python3 - "${chart_dir}" "${DOCKERHUB_USERNAME}" "${IMAGE_TAG}" <<'PY'
          from pathlib import Path
          import sys

          chart_dir = Path(sys.argv[1])
          username = sys.argv[2]
          image_tag = sys.argv[3]

          chart_file = chart_dir / "Chart.yaml"
          chart = chart_file.read_text()
          repositories = {
              "file://../../cart/chart": "file://charts-src/cart",
              "file://../../catalog/chart": "file://charts-src/catalog",
              "file://../../checkout/chart": "file://charts-src/checkout",
              "file://../../orders/chart": "file://charts-src/orders",
              "file://../../ui/chart": "file://charts-src/ui",
          }
          for old, new in repositories.items():
              if old not in chart:
                  raise SystemExit(f"Expected chart dependency path not found: {old}")
              chart = chart.replace(old, new)
          chart_file.write_text(chart)

          images = {
              "ui": "storefront",
              "catalog": "catalog",
              "cart": "cart",
              "checkout": "checkout",
              "orders": "orders",
          }
          lines = ["# Generated by the application build workflow."]
          for service, image in images.items():
              lines.extend(
                  [
                      f"{service}:",
                      "  image:",
                      f"    repository: {username}/{image}",
                      f"    tag: {image_tag}",
                  ]
              )
          (chart_dir / "values-dev.yaml").write_text("\n".join(lines) + "\n")
          PY

          helm dependency update "${chart_dir}"
          helm lint "${chart_dir}" --values "${chart_dir}/values-dev.yaml"
          helm template retail-shop "${chart_dir}" \
            --namespace retail-shop \
            --values "${chart_dir}/values-dev.yaml" \
            > "${RUNNER_TEMP}/retail-shop-rendered.yaml"
          test -s "${RUNNER_TEMP}/retail-shop-rendered.yaml"

      - name: Create GitOps pull request
        shell: bash
        run: |
          set -euo pipefail
          HELM_REPO="$(printf '%s' "${HELM_REPO}" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [[ ! "${HELM_REPO}" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]]; then
            echo "::error::HELM_REPO must be a repository in owner/repo form; received an invalid value."
            exit 1
          fi

          branch="automation/retail-shop-${GITHUB_SHA:0:12}"

          git -C helm-repo config user.name "github-actions[bot]"
          git -C helm-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C helm-repo add apps/retail-shop

          if git -C helm-repo diff --cached --quiet; then
            echo "The GitOps chart already matches this image build."
            exit 0
          fi

          git -C helm-repo commit -m "Deploy retail shop ${GITHUB_SHA:0:12}"
          git -C helm-repo push origin "${branch}"
          repo_owner="${HELM_REPO%%/*}"

          if ! existing_pr=$(gh api "repos/${HELM_REPO}/pulls" \
            --method GET \
            -f state=open \
            -f head="${repo_owner}:${branch}" \
            -f base=main \
            --jq '.[0].html_url // ""' 2>&1); then
            echo "::error::The branch was pushed, but GitHub could not list pull requests in ${HELM_REPO}."
            echo "::error::Grant GH_PAT access to ${HELM_REPO} with Contents read/write and Pull requests read/write permissions."
            echo "::error::GitHub API response: ${existing_pr}"
            exit 1
          fi

          if [[ -n "${existing_pr}" ]]; then
            echo "Updated the existing GitOps pull request: ${existing_pr}"
          else
            echo "Creating a new pull request..."
            gh api "repos/${HELM_REPO}/pulls" \
              --method POST \
              -f title="Deploy retail shop ${GITHUB_SHA:0:12}" \
              -f head="${branch}" \
              -f base=main \
              -f body="Automated deployment update for retail shop services targeting commit ${GITHUB_SHA}."
          fi
