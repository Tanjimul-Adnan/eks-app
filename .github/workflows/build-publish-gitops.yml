name: build-publish-gitops

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write 

jobs:
  build-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [storefront, catalog, cart, checkout]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tanjimuladnan
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            docker.io/tanjimuladnan/${{ matrix.service }}:latest
            docker.io/tanjimuladnan/${{ matrix.service }}:${{ github.sha }}

  update-gitops:
    needs: build-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Helm GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HELM_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: helm-repo

      - name: Update image tags and create PR
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HELM_REPO: ${{ vars.HELM_REPO }}
          RAW_VALUES_FILES: ${{ vars.HELM_VALUES_FILES || 'apps/retail-shop/values-dev.yaml' }}
        run: |
          set -euo pipefail
          
          # 1. Clean up and resolve the file path out of the comma-separated string
          HELM_VALUES_FILES=$(echo "$RAW_VALUES_FILES" | tr ',' '\n' | head -n 1 | xargs)
          export HELM_VALUES_FILES
          
          # 2. Check if the file exists inside the checked-out helm subfolder
          if [[ ! -f "helm-repo/$HELM_VALUES_FILES" ]]; then
            echo "::error::HELM_VALUES_FILES '$HELM_VALUES_FILES' does not exist inside the helm-repo directory."
            exit 1
          fi

          cd helm-repo
          
          BRANCH="bot/retail-${GITHUB_SHA::12}"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > /dev/null; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi

          python - <<'PY'
          import os
          import re
          
          path = os.environ["HELM_VALUES_FILES"]
          sha = os.environ["SHA"]
          
          with open(path, encoding="utf-8") as f:
              lines = f.readlines()
              
          services = ["storefront", "catalog", "cart", "checkout"]
          current_service = None
          in_image_block = False
          
          updated_lines = []
          
          for line in lines:
              # Detect service block start (e.g., "storefront:")
              match_service = re.match(r"^ {2}(\w+):\s*$", line)
              if match_service:
                  service_name = match_service.group(1)
                  if service_name in services:
                      current_service = service_name
                      in_image_block = False
                  else:
                      current_service = None
              
              # Detect if we hit another top-level structural block
              elif re.match(r"^\S", line) or re.match(r"^ {2}\w+:\s*$", line):
                  current_service = None
                  
              if current_service:
                  # Detect if entering image section inside the active service block
                  if re.match(r"^ {4}image:\s*$", line):
                      in_image_block = True
                  elif in_image_block and not line.startswith("    "):
                      in_image_block = False
                      
                  if in_image_block:
                      # Flexible whitespace matching for repository configuration keys
                      if "repository:" in line:
                          indent = len(line) - len(line.lstrip())
                          line = f"{' ' * indent}repository: tanjimuladnan/{current_service}\n"
                      # Flexible whitespace matching for tag configuration keys
                      elif "tag:" in line:
                          indent = len(line) - len(line.lstrip())
                          line = f"{' ' * indent}tag: \"{sha}\"\n"
                          
              updated_lines.append(line)
              
          with open(path, "w", encoding="utf-8") as f:
              f.writelines(updated_lines)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add "$HELM_VALUES_FILES"
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update retail shop images to ${SHA}"
            git push origin "$BRANCH"
          fi
          
          PR_URL="$(gh pr list --repo "$HELM_REPO" --head "${HELM_REPO%%/*}:$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$PR_URL" ]]; then
            # Verify remote changes exist between branches before running gh pr create
            if ! git diff --quiet origin/main..HEAD; then
              gh pr create --repo "$HELM_REPO" --base main --head "$BRANCH" --title "chore: deploy retail shop ${SHA}" --body "Automated Docker Hub image update from retail-shop-app commit ${SHA}. Review and merge to deploy via Argo CD."
            else
              echo "Image values are already up to date; no pull request is needed."
              exit 0
            fi
          fi
